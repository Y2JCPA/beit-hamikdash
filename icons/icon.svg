<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#3a3560"/><stop offset=".55" stop-color="#1b2440"/><stop offset="1" stop-color="#0b0f1d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf6a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" x2="1">
      <stop offset="0" stop-color="#a8701a"/><stop offset=".35" stop-color="#ffe08a"/><stop offset=".6" stop-color="#f2b83c"/><stop offset="1" stop-color="#9a6414"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5610"/><stop offset="1" stop-color="#c88a26"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/><stop offset="1" stop-color="#e8a83a"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6e0" stop-opacity=".95"/><stop offset="1" stop-color="#e6dcff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <ellipse cx="256" cy="300" rx="190" ry="170" fill="url(#glow)"/>
  <!-- the Ketoret smoke rises straight up, like a column -->
  <path d="M262 192 C 250 150, 272 110, 258 70 C 250 46, 264 30, 278 22" fill="none" stroke="url(#smoke)" stroke-width="26" stroke-linecap="round"/>
  <path d="M248 190 C 240 160, 252 140, 244 112" fill="none" stroke="url(#smoke)" stroke-width="10" stroke-linecap="round" opacity=".55"/>
  <!-- the altar: a box one amah square, two amot tall, with horns and a gold crown (Shemot 30:1-3) -->
  <g>
    <!-- top surface in perspective -->
    <polygon points="160,214 352,214 382,192 190,192" fill="url(#top)"/>
    <!-- glowing coals -->
    <ellipse cx="271" cy="203" rx="66" ry="9" fill="#ff7a1a" opacity=".9"/>
    <circle cx="246" cy="203" r="7" fill="#ffd36e"/><circle cx="270" cy="201" r="8" fill="#fff0b8"/><circle cx="295" cy="204" r="6" fill="#ffd36e"/>
    <!-- body -->
    <rect x="160" y="214" width="192" height="236" fill="url(#front)"/>
    <polygon points="352,214 382,192 382,428 352,450" fill="url(#side)"/>
    <!-- the gold crown (zer) around the top -->
    <rect x="152" y="226" width="208" height="22" rx="4" fill="#ffd36e" stroke="#9a6414" stroke-width="3"/>
    <polygon points="360,226 390,204 390,226 360,248" fill="#c88a26"/>
    <!-- panels -->
    <rect x="184" y="268" width="144" height="156" rx="6" fill="none" stroke="#9a6414" stroke-width="5" opacity=".55"/>
    <rect x="200" y="284" width="112" height="124" rx="4" fill="none" stroke="#fff3c4" stroke-width="3" opacity=".45"/>
    <!-- horns: two at the back, two at the front -->
    <rect x="186" y="166" width="22" height="30" rx="5" fill="#d99a2e"/>
    <rect x="356" y="166" width="22" height="30" rx="5" fill="#b87a1e"/>
    <rect x="150" y="180" width="30" height="40" rx="6" fill="#ffe08a" stroke="#9a6414" stroke-width="3"/>
    <rect x="332" y="180" width="30" height="40" rx="6" fill="#f2b83c" stroke="#9a6414" stroke-width="3"/>
    <!-- base -->
    <rect x="148" y="450" width="216" height="14" rx="4" fill="#c88a26"/>
  </g>
</svg>
